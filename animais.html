<title>Mundo dos Animais | DESAFIA+ KIDS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Trebuchet MS',Arial,sans-serif;
 background:linear-gradient(135deg,#d8fff0,#e8f5ff,#fff5d9);
 color:#243447;
 min-height:100vh;
}
header{
 background:linear-gradient(120deg,#079b78,#35c99c);
 color:white;
 padding:22px 15px;
 text-align:center;
 border-radius:0 0 28px 28px;
}
header h1{margin:5px;font-size:29px}
header p{margin:6px;font-size:14px}
.top{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;
 max-width:650px;margin:15px auto;padding:0 14px;
}
button,select{
 border:0;border-radius:15px;padding:12px 15px;
 font-weight:bold;font-size:14px;cursor:pointer;
}
.back{background:white;color:#168b70}
select{background:white;color:#168b70}
.container{
 max-width:650px;margin:12px auto;padding:14px;
}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin-bottom:15px;
}
.stat{
 background:white;border-radius:16px;padding:12px;
 text-align:center;box-shadow:0 4px 12px #00000010;
}
.stat strong{display:block;font-size:21px;color:#079b78}
.stat span{font-size:12px}
.progress{
 height:12px;background:#d5e9e2;border-radius:20px;
 overflow:hidden;margin:10px 0 18px;
}
.bar{height:100%;width:0;background:#16b98b;transition:.3s}
.game{
 background:white;border-radius:25px;padding:20px;
 box-shadow:0 8px 25px #00000012;text-align:center;
}
.animal{
 font-size:95px;margin:12px auto;
 width:150px;height:135px;
 display:flex;align-items:center;justify-content:center;
 background:#effcf6;border-radius:25px;
}
.question{font-size:21px;font-weight:bold;margin:15px 0}
.answers{
 display:grid;grid-template-columns:1fr 1fr;
 gap:11px;margin-top:20px;
}
.answer{
 background:#eaf8f2;color:#176b57;
 border:2px solid #d2eee2;
 min-height:62px;font-size:17px;
}
.answer:active{transform:scale(.97)}
.answer:disabled{opacity:.85;cursor:default}
.feedback{
 min-height:35px;font-size:17px;
 font-weight:bold;margin-top:15px;
}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.primary{background:#0ca77e;color:white}
.sound{background:#fff0bd;color:#765400}
.hidden{display:none}
.result{font-size:19px;padding:20px}
footer{text-align:center;padding:20px;font-size:12px;color:#527568}
@media(max-width:420px){
 header h1{font-size:25px}
 .question{font-size:19px}
 .answer{font-size:15px;padding:10px 5px}
}
</style>
</head>

</main>

<footer>DESAFIA+ KIDS • Aprender é uma aventura! 🌈</footer>

const HISTORY_KEY="desafiamais_animais_history_v1";
const YEAR_MS=365*24*60*60*1000;
let lang="pt",questions=[],index=0,score=0,stars=0,answered=false;
let musicOn=false,audioCtx=null,musicTimer=null,musicStep=0;

function getText(key){return translations[lang][key]}
function changeLanguage(){
 lang=document.getElementById("language").value;
 document.getElementById("scoreLabel").textContent=getText("points");
 document.getElementById("starsLabel").textContent=getText("stars");
 document.getElementById("roundLabel").textContent=getText("questions");
 document.getElementById("start").textContent=getText("start");
 document.getElementById("musicButton").textContent=getText("music")+(musicOn?getText("on"):getText("off"));
 document.getElementById("question").textContent=getText("intro");
 if(index<questions.length && questions.length && !answered)showQuestion();
 document.getElementById("again").textContent=getText("again");
 document.getElementById("resultTitle").textContent=getText("result");
}

function loadHistory(){
 try{
  const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||"{}");
  const now=Date.now();
  const clean={};
  for(const [key,time] of Object.entries(data)){
   if(now-time<YEAR_MS)clean[key]=time;
  }
  localStorage.setItem(HISTORY_KEY,JSON.stringify(clean));
  return clean;
 }catch(e){return {}}
}
function saveHistory(history){
 try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}
 catch(e){}
}
function shuffle(array){
 for(let i=array.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
 }
 return array;
}

function startGame(){
 const history=loadHistory();
 const available=shuffle(bank.filter((q,i)=>!history[i]));
 if(available.length<10){
  alert(getText("empty"));
  return;
 }
 questions=available.slice(0,10);
 index=0;score=0;stars=0;answered=false;
 document.getElementById("score").textContent=0;
 document.getElementById("stars").textContent="⭐ 0";
 document.getElementById("round").textContent="0/10";
 document.getElementById("bar").style.width="0%";
 document.getElementById("game").classList.remove("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("start").classList.add("hidden");
 showQuestion();
}

function showQuestion(){
 answered=false;
 const q=questions[index];
 document.getElementById("animal").textContent=q.e;
 document.getElementById("question").textContent=getText("question");
 document.getElementById("feedback").textContent="";
 document.getElementById("round").textContent=(index+1)+"/10";
 document.getElementById("bar").style.width=(index/10*100)+"%";
 const options=document.getElementById("answers");
 options.innerHTML="";
 const answers=q[lang==="pt"?"a":lang];
 const order=shuffle([0,1,2,3]);
 order.forEach(pos=>{
  const b=document.createElement("button");
  b.className="answer";
  b.textContent=answers[pos];
  b.onclick=()=>checkAnswer(pos,q,b);
  options.appendChild(b);
 });
}

function checkAnswer(choice,q,button){
 if(answered)return;
 answered=true;
 const correct=choice===q.c;
 const buttons=document.querySelectorAll(".answer");
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(b.textContent===q[lang==="pt"?"a":lang][q.c]){
   b.style.background="#c8f5dc";
   b.style.borderColor="#20aa72";
  }
 });
 if(correct){
  score+=10;stars++;
  document.getElementById("feedback").textContent=getText("correct");
  tone(660,.16);setTimeout(()=>tone(880,.2),150);
 }else{
  document.getElementById("feedback").textContent=getText("wrong");
  tone(220,.25);
 }
 document.getElementById("score").textContent=score;
 document.getElementById("stars").textContent="⭐ "+stars;
 document.getElementById("bar").style.width=((index+1)/10*100)+"%";
 const history=loadHistory();
 history[bank.indexOf(q)]=Date.now();
 saveHistory(history);
 const next=document.createElement("button");
 next.className="primary";
 next.textContent=getText("next");
 next.onclick=()=>{
  index++;
  if(index<10)showQuestion();
  else finishGame();
 };
 document.querySelector(".actions").appendChild(next);
}

function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("resultText").textContent=
  getText("finished")+" "+getText("earned")+" "+score+"/100 ⭐ "+stars;
 document.getElementById("round").textContent="10/10";
 document.getElementById("bar").style.width="100%";
 document.getElementById("start").classList.remove("hidden");
}

function tone(freq,duration){
 try{
  const ctx=getAudio();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+duration+.03);
 }catch(e){}
}
function getAudio(){
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx;
}
function playMusic(){
 const melody=[392,440,494,587,494,440,392,330];
 const bass=[131,147,165,147];
 const ctx=getAudio();
 const note=melody[musicStep%melody.length];
 const low=bass[musicStep%bass.length];
 function play(freq,duration,volume,type){
  const o=ctx.createOscillator(),g=ctx
