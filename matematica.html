<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7856e8">
<title>Matemática Divertida | DESAFIA+ KIDS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Trebuchet MS',Arial,sans-serif;
 background:linear-gradient(135deg,#fff2bd,#f0e5ff,#dff8ff);
 color:#30245c;
 min-height:100vh;
}
header{
 background:linear-gradient(120deg,#7048e8,#ae50e9);
 color:white;text-align:center;padding:22px 12px;
 border-radius:0 0 30px 30px;
}
.logo{font-size:26px;font-weight:900}
header p{margin:7px 0 0}
.container{width:92%;max-width:520px;margin:22px auto}
.panel{
 background:white;padding:20px;border-radius:25px;
 box-shadow:0 7px 22px #39236b18;text-align:center;
}
.topbar{
 display:flex;justify-content:center;gap:8px;
 flex-wrap:wrap;align-items:center;
}
select,.small-btn{
 padding:10px;border-radius:12px;
 border:2px solid #e6dcff;background:white;
 font-weight:bold;color:#5535a7;
}
h1{font-size:25px;margin:20px 0 8px}
.score{
 background:#fff1a8;padding:10px 16px;
 border-radius:15px;font-weight:bold;display:inline-block;
}
.question{
 background:#f1eaff;border-radius:22px;
 padding:24px 10px;margin:20px 0;
}
.question small{color:#7959c5;font-weight:bold}
.math{font-size:48px;font-weight:900;color:#673bd1;margin:12px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{
 border:0;border-radius:18px;padding:19px 8px;
 font-size:25px;font-weight:900;color:#38245f;
 background:#e8f5ff;cursor:pointer;
 box-shadow:0 4px 0 #c5e3f7;
}
.answer:nth-child(2){background:#ffe9ed;box-shadow:0 4px 0 #f7c8d1}
.answer:nth-child(3){background:#e8ffe9;box-shadow:0 4px 0 #bce8c0}
.answer:nth-child(4){background:#fff4d8;box-shadow:0 4px 0 #f2dfaa}
.answer:disabled{opacity:.8}
.feedback{min-height:45px;font-weight:bold;font-size:18px;margin:14px 0}
.stars{font-size:27px;letter-spacing:3px;margin:12px}
.progress{height:12px;background:#eee8fa;border-radius:20px;overflow:hidden}
.progress div{
 height:100%;width:0;
 background:linear-gradient(90deg,#ffbd35,#ff7a59);
 transition:width .3s;
}
button.main{
 border:0;background:linear-gradient(120deg,#7048e8,#a34be8);
 color:white;font-weight:bold;padding:15px 24px;
 border-radius:16px;font-size:17px;cursor:pointer;margin-top:15px;
}
button:focus-visible,select:focus-visible{
 outline:3px solid #ffae30;outline-offset:3px;
}
.hidden{display:none!important}
.music-status{font-size:13px;color:#796c9d;margin-top:10px}
footer{text-align:center;padding:20px;color:#796c9d;font-size:13px}
@media(max-width:360px){
 .math{font-size:39px}
 .answer{font-size:21px}
}
</style>
</head>

<body>

<header>
 <div class="logo">🌈 DESAFIA+ KIDS</div>
 <p id="headerText">Aprender também pode ser uma aventura!</p>
</header>

<div class="container">
<div class="panel">

 <div class="topbar">
  <select id="language" onchange="changeLanguage()">
   <option value="pt">🇦🇴 Português</option>
   <option value="en">🇬🇧 English</option>
   <option value="fr">🇫🇷 Français</option>
   <option value="es">🇪🇸 Español</option>
  </select>
  <button class="small-btn" id="musicBtn" onclick="toggleMusic()">🎵 Ligar música</button>
  <button class="small-btn" id="soundBtn" onclick="toggleSound()">🔊 Efeitos ligados</button>
 </div>

 <div class="music-status" id="musicStatus">A música começa quando tocares no botão 🎵</div>

 <h1 id="title">🧮 Matemática divertida</h1>
 <p id="intro">Vamos descobrir quantas respostas consegues acertar!</p>

 <div class="score">⭐ <span id="points">0</span><span id="pointsLabel"> estrelas</span></div>

 <div class="question">
  <small id="questionLabel">PERGUNTA 1 DE 10</small>
  <div class="math" id="math">2 + 3 = ?</div>
  <button class="small-btn" onclick="speakQuestion()">🔈 <span id="listenText">Ouvir pergunta</span></button>
 </div>

 <div class="answers" id="answers">
  <button class="answer" onclick="checkAnswer(0)">5</button>
  <button class="answer" onclick="checkAnswer(1)">4</button>
  <button class="answer" onclick="checkAnswer(2)">6</button>
  <button class="answer" onclick="checkAnswer(3)">7</button>
 </div>

 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="stars" id="stars">☆☆☆☆☆☆☆☆☆☆</div>
 <div class="progress"><div id="progress"></div></div>

 <button class="main hidden" id="nextBtn" onclick="nextQuestion()">Próxima pergunta ➜</button>

 <div id="result" class="hidden">
  <h1 id="resultTitle">🏆 Parabéns!</h1>
  <p id="resultText"></p>
  <button class="main" onclick="startGame()" id="restartBtn">🔄 Jogar novamente</button>
 </div>

</div>
</div>

<footer>DESAFIA+ KIDS • Aprender brincando 🌟</footer>

<script>
const translations={
pt:{
header:"Aprender também pode ser uma aventura!",
title:"🧮 Matemática divertida",
intro:"Vamos descobrir quantas respostas consegues acertar!",
points:" estrelas",question:"PERGUNTA",of:"DE",
listen:"Ouvir pergunta",musicOn:"🎵 Desligar música",
musicOff:"🎵 Ligar música",soundOn:"🔊 Efeitos ligados",
soundOff:"🔇 Efeitos desligados",
statusOn:"A música está a tocar 🎶",
statusOff:"A música está desligada",
correct:"🎉 Muito bem! Acertaste!",
wrong:"😊 Não faz mal! Vamos tentar a próxima!",
next:"Próxima pergunta ➜",result:"🏆 Parabéns!",
restart:"🔄 Jogar novamente",
final:n=>"Conseguiste "+n+" de 10 estrelas! Continua a aprender!",
speak:"Quanto é",plus:"mais",minus:"menos"
},
en:{
header:"Learning can also be an adventure!",
title:"🧮 Fun Mathematics",
intro:"Let's see how many answers you can get right!",
points:" stars",question:"QUESTION",of:"OF",
listen:"Listen to question",musicOn:"🎵 Turn music off",
musicOff:"🎵 Turn music on",soundOn:"🔊 Effects on",
soundOff:"🔇 Effects off",statusOn:"Music is playing 🎶",
statusOff:"Music is off",
correct:"🎉 Well done! Correct!",
wrong:"😊 That's okay! Let's try the next one!",
next:"Next question ➜",result:"🏆 Congratulations!",
restart:"🔄 Play again",
final:n=>"You earned "+n+" out of 10 stars! Keep learning!",
speak:"How much is",plus:"plus",minus:"minus"
},
fr:{
header:"Apprendre peut aussi être une aventure !",
title:"🧮 Mathématiques amusantes",
intro:"Voyons combien de réponses tu peux trouver !",
points:" étoiles",question:"QUESTION",of:"SUR",
listen:"Écouter la question",musicOn:"🎵 Couper la musique",
musicOff:"🎵 Activer la musique",soundOn:"🔊 Effets activés",
soundOff:"🔇 Effets désactivés",
statusOn:"La musique joue 🎶",statusOff:"La musique est coupée",
correct:"🎉 Bravo ! Bonne réponse !",
wrong:"😊 Ce n'est pas grave ! Passons à la suivante !",
next:"Question suivante ➜",result:"🏆 Félicitations !",
restart:"🔄 Rejouer",
final:n=>"Tu as gagné "+n+" étoiles sur 10 ! Continue !",
speak:"Combien font",plus:"plus",minus:"moins"
},
es:{
header:"¡Aprender también puede ser una aventura!",
title:"🧮 Matemáticas divertidas",
intro:"¡Vamos a ver cuántas respuestas puedes acertar!",
points:" estrellas",question:"PREGUNTA",of:"DE",
listen:"Escuchar pregunta",musicOn:"🎵 Apagar música",
musicOff:"🎵 Activar música",soundOn:"🔊 Efectos activados",
soundOff:"🔇 Efectos desactivados",
statusOn:"La música está sonando 🎶",statusOff:"La música está apagada",
correct:"🎉 ¡Muy bien! ¡Correcto!",
wrong:"😊 ¡No pasa nada! ¡Vamos con la siguiente!",
next:"Siguiente pregunta ➜",result:"🏆 ¡Felicidades!",
restart:"🔄 Jugar otra vez",
final:n=>"¡Conseguiste "+n+" de 10 estrellas! ¡Sigue aprendiendo!",
speak:"¿Cuánto es",plus:"más",minus:"menos"
}
};

let lang="pt";
let sound=true;
let musicEnabled=false;
let audioContext=null;
let musicTimer=null;
let musicStep=0;
let questions=[];
let current=0;
let score=0;
let answered=false;

const melody=[
523.25,659.25,783.99,659.25,
587.33,698.46,880,698.46,
523.25,659.25,783.99,880,
783.99,659.25,587.33,523.25
];

const bass=[130.81,164.81,196,164.81];

function getAudio(){
 if(!audioContext){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw new Error("Áudio não suportado");
  audioContext=new Audio();
 }
 return audioContext;
}

function note(freq,volume,duration,type="sine"){
 const ctx=getAudio();
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 const now=ctx.currentTime;

 osc.type=type;
 osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(0.0001,now);
 gain.gain.linearRampToValueAtTime(volume,now+.04);
 gain.gain.setValueAtTime(volume,now+duration*.65);
 gain.gain.linearRampToValueAtTime(.0001,now+duration);

 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(now);
 osc.stop(now+duration+.02);
}

function playMusicNote(){
 if(!musicEnabled||!audioContext)return;

 const index=musicStep%melody.length;

 note(melody[index],.055,.48,"triangle");
 note(bass[musicStep%bass.length],.035,.52,"sine");

 musicStep++;
}

async function startMusic(){
 if(!musicEnabled||musicTimer)return;

 try{
  const ctx=getAudio();
  await ctx.resume();

  if(!musicEnabled)return;

  playMusicNote();
  musicTimer=setInterval(playMusicNote,550);

  document.getElementById("musicStatus").textContent=
   translations[lang].statusOn;
 }catch(error){
  document.getElementById("musicStatus").textContent=
   "Não foi possível iniciar o áudio. Toca novamente no botão.";
 }
}

function stopMusic(){
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
 document.getElementById("musicStatus").textContent=
  translations[lang].statusOff;
}

async function toggleMusic(){
 if(!musicEnabled){
  musicEnabled=true;
  document.getElementById("musicBtn").textContent=
   translations[lang].musicOn;
  await startMusic();
 }else{
  musicEnabled=false;
  stopMusic();
  document.getElementById("musicBtn").textContent=
   translations[lang].musicOff;
 }
}

function playTone(freq,duration=.16){
 if(!sound)return;
 try{note(freq,.10,duration,"sine");}catch(e){}
}

function toggleSound(){
 sound=!sound;
 document.getElementById("soundBtn").textContent=
  sound?translations[lang].soundOn:translations[lang].soundOff;
}

function speak(text){
 if(!("speechSynthesis" in window)){
  document.getElementById("feedback").textContent=
   "A voz não está disponível neste navegador.";
  return;
 }
 speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(text);
 voice.lang={pt:"pt-PT",en:"en-US",fr:"fr-FR",es:"es-ES"}[lang];
 voice.rate=.85;
 speechSynthesis.speak(voice);
}

function speakQuestion(){
 const q=questions[current];
 const t=translations[lang];
 const op=q.operation==="+"?t.plus:t.minus;
 speak(t.speak+" "+q.a+" "+op+" "+q.b+"?");
}

function makeQuestions(){
 const list=[];
 for(let i=0;i<10;i++){
  let a=Math.floor(Math.random()*10)+1;
  let b=Math.floor(Math.random()*10)+1;
  let operation=Math.random()<.5?"+":"-";

  if(operation==="-"&&b>a)[a,b]=[b,a];

  const answer=operation==="+"?a+b:a-b;
  const choices=new Set([answer]);

  while(choices.size<4){
   const option=answer+Math.floor(Math.random()*9)-4;
   if(option>=0&&option!==answer)choices.add(option);
  }

  const options=[...choices].sort(()=>Math.random()-.5);
  list.push({a,b,operation,answer,options});
 }
 return list;
}

function changeLanguage(){
 lang=document.getElementById("language").value;
 const t=translations[lang];
 document.documentElement.lang=lang;

 document.getElementById("headerText").textContent=t.header;
 document.getElementById("title").textContent=t.title;
 document.getElementById("intro").textContent=t.intro;
 document.getElementById("pointsLabel").textContent=t.points;
 document.getElementById("listenText").textContent=t.listen;
 document.getElementById("musicBtn").textContent=
  musicEnabled?t.musicOn:t.musicOff;
 document.getElementById("soundBtn").textContent=
  sound?t.soundOn:t.soundOff;
 document.getElementById("musicStatus").textContent=
  musicEnabled?t.statusOn:t.statusOff;
 document.getElementById("nextBtn").textContent=t.next;
 document.getElementById("resultTitle").textContent=t.result;
 document.getElementById("restartBtn").textContent=t.restart;

 if(questions.length&&current<10)showQuestion();
}

function checkAnswer(index){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const t=translations[lang];
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

 if(q.options[index]===q.answer){
  score++;
  playTone(660,.15);
  setTimeout(()=>playTone(880,.2),160);
  document.getElementById("feedback").textContent=t.correct;
 }else{
  playTone(220,.2);
  document.getElementById("feedback").textContent=t.wrong;
 }

 document.getElementById("points").textContent=score;
 document.getElementById("stars").textContent=
  "★".repeat(score)+"☆".repeat(10-score);
 document.getElementById("progress").style.width=
  ((current+1)*10)+"%";
 document.getElementById("nextBtn").classList.remove("hidden");
}

function showQuestion(){
 answered=false;
 const q=questions[current];
 const t=translations[lang];

 document.getElementById("math").textContent=
  q.a+" "+q.operation+" "+q.b+" = ?";
 document.getElementById("questionLabel").textContent=
  t.question+" "+(current+1)+" "+t.of+" 10";
 document.getElementById("feedback").textContent="";
 document.getElementById("nextBtn").classList.add("hidden");

 document.querySelectorAll(".answer").forEach((button,index)=>{
  button.disabled=false;
  button.textContent=q.options[index];
 });
}

function nextQuestion(){
 current++;
 if(current>=10){finishGame();return;}
 showQuestion();
}

function finishGame(){
 document.getElementById("answers").classList.add("hidden");
 document.querySelector(".question").classList.add("hidden");
 document.getElementById("nextBtn").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultText").textContent=
  translations[lang].final(score);

 if(score>=7){
  playTone(660,.2);
  setTimeout(()=>playTone(880,.2),200);
  setTimeout(()=>playTone(1040,.3),400);
 }
}

function startGame(){
 questions=makeQuestions();
 current=0;
 score=0;

 document.getElementById("points").textContent="0";
 document.getElementById("stars").textContent="☆☆☆☆☆☆☆☆☆☆";
 document.getElementById("progress").style.width="0%";
 document.getElementById("result").classList.add("hidden");
 document.getElementById("answers").classList.remove("hidden");
 document.querySelector(".question").classList.remove("hidden");

 showQuestion();
}

startGame();
</script>
</body>
</html>
