for(let a=10;a<=99;a+=3)for(let b=2;b<=9;b++){let n=a+b;questions.push({id:"sum"+a+"+"+b,cat:"Matemática",text:{pt:"Quanto é "+a+" + "+b+"?",en:"What is "+a+" + "+b+"?",fr:"Combien font "+a+" + "+b+" ?",es:"¿Cuánto es "+a+" + "+b+"?"},opts:{pt:makeOptions(n),en:makeOptions(n),fr:makeOptions(n),es:makeOptions(n)},answer:String(n)})}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const STORE="desafiamais_cultura_progress_v4";let lang="pt",history=[],session=[],position=0,score=0,streak=0,answered=false,total=0;
try{history=JSON.parse(localStorage.getItem(STORE)||"[]");if(!Array.isArray(history))history=[]}catch(e){history=[]}
const $=id=>document.getElementById(id);const music=$("bgMusic");let musicOn=false;
function save(){try{localStorage.setItem(STORE,JSON.stringify(history))}catch(e){}}
function level(){return Math.floor(total/20)+1}
function translate(){const t=T[lang];document.documentElement.lang=lang;$("tagline").textContent=t.tag;$("heading").textContent=t.title;$("home").textContent=t.home;$("saved").textContent=t.saved;$("next").textContent=t.next;$("continue").textContent=t.continue;$("musicToggle").textContent=musicOn?t.musicOn:t.musicOff;if(session.length&&position<session.length&&!answered)render()}
function startGame(){score=0;streak=0;position=0;const available=questions.filter(q=>!history.includes(q.id));if(!available.length){showExhausted();return}session=shuffle(available);$("result").style.display="none";$("game").style.display="block";render()}
function render(){if(position>=session.length){finish();return}answered=false;const q=session[position],t=T[lang];$("counter").textContent=t.question+" "+(total+1);$("points").textContent="⭐ "+score+" "+t.points;$("streak").textContent="🔥 "+streak;$("level").textContent=t.level+" "+level()+" · "+(level()<4?"Explorador":level()<8?"Aventureiro":"Mestre");$("bar").style.width=(position%20)/20*100+"%";$("category").textContent=t.cat[q.cat]||q.cat;$("question").textContent=q.text[lang];$("feedback").textContent="";$("next").disabled=true;$("next").textContent=t.next;let opts=q.opts[lang].map(String);if(!opts.includes(String(q.answer)))opts[0]=String(q.answer);opts=shuffle([...new Set(opts)]);while(opts.length<4)opts.push("—");$("answers").innerHTML="";opts.slice(0,4).forEach(option=>{const b=document.createElement("button");b.className="answer";b.textContent=option;b.onclick=()=>choose(b,option,q);$("answers").appendChild(b)})}
function choose(button,choice,q){if(answered)return;answered=true;const correct=String(q.answer);[...$("answers").children].forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("correct")});if(String(choice)===correct){score++;streak++;total++;$("feedback").textContent=T[lang].correct}else{streak=0;total++;$("feedback").textContent=T[lang].wrong+" "+correct;button.classList.add("wrong")}if(!history.includes(q.id))history.push(q.id);save();$("points").textContent="⭐ "+score+" "+T[lang].points;$("streak").textContent="🔥 "+streak;$("next").disabled=false}
function finish(){$("game").style.display="none";$("result").style.display="block";$("finalScore").textContent=score+" ⭐";const t=T[lang];$("finished").textContent=t.finished;$("resultText").textContent=score>=15?t.excellent:score>=7?t.good:t.try;$("remaining").textContent=t.left+" "+Math.max(0,questions.length-history.length);$("bar").style.width="100%"}
function showExhausted(){$("game").style.display="none";$("result").style.display="block";$("finished").textContent=T[lang].end;$("finalScore").textContent="🏅";$("resultText").textContent=T[lang].excellent;$("remaining").textContent=T[lang].left+" 0"}
$("next").onclick=()=>{if(!answered)return;position++;render()};$("continue").onclick=startGame;$("language").onchange=e=>{lang=e.target.value;translate()};$("musicToggle").onclick=async()=>{if(!musicOn){try{await music.play();musicOn=true}catch(e){$("musicToggle").textContent="Toque novamente para ligar";return}}else{music.pause();musicOn=false}translate()};music.volume=.22;music.addEventListener("ended",()=>{music.currentTime=0;if(musicOn)music.play()});translate();startGame();
</script></body></html>
