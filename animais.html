<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7655e8">
<title>Mundo dos Animais | DESAFIA+ KIDS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#f1edff,#e9f9ff);color:#26304a;min-height:100vh}
header{background:#7655e8;color:white;text-align:center;padding:22px 14px 26px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:clamp(25px,6vw,36px)}
header p{margin:8px 0 0;font-size:15px}
main{width:min(720px,94%);margin:18px auto 35px}
.panel{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 25px #40308018;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select,button{font:inherit;border:0;border-radius:14px;padding:12px 15px}
select{background:#f0edff;color:#34256f}
button{cursor:pointer;font-weight:800}
.primary{background:#7655e8;color:white;width:100%;font-size:18px;padding:16px}
.secondary{background:#eeeaff;color:#5137b6}
#game{display:none;text-align:center}
#progress{height:10px;background:#eee9ff;border-radius:20px;overflow:hidden;margin:14px 0}
#bar{height:100%;width:0;background:#7655e8;transition:width .25s}
#animal{font-size:76px;margin:12px 0}
#question{font-size:21px;font-weight:800;line-height:1.35;margin:10px 0 18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{background:#f1efff;color:#392b72;min-height:58px;font-size:17px}
.answer:disabled{opacity:1;cursor:default}
.answer.correct{background:#d9f8e5;color:#126438}
.answer.wrong{background:#ffe0e0;color:#9a2525}
#feedback{min-height:28px;font-weight:800;margin:14px 0}
#next{display:none;margin-top:8px;width:100%;background:#ffbd4a;color:#523500;font-size:17px}
#result{display:none;text-align:center}
#stars{font-size:34px;color:#ffb800}
.small{font-size:13px;color:#6c7185}
@media(max-width:420px){.panel{padding:16px}.answer{font-size:15px;padding:12px 8px}#question{font-size:19px}}
</style>
</head>
<body>
<header>
  <h1>🐾 Mundo dos Animais</h1>
  <p>Aprende, descobre e diverte-te!</p>
</header>
<main>
  <section class="panel">
    <div class="row">
      <strong id="languageLabel">Idioma</strong>
      <select id="language" aria-label="Idioma">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
      <button class="secondary" id="musicButton" type="button">🔊 Som ligado</button>
    </div>
    <p class="small" id="intro">Responde a 10 perguntas e ganha estrelas!</p>
    <button class="primary" id="startButton" type="button">COMEÇAR A JOGAR</button>
  </section>

  <section class="panel" id="game">
    <div class="row">
      <strong id="questionCount">Pergunta 1 de 10</strong>
      <strong id="score">⭐ 0</strong>
    </div>
    <div id="progress"><div id="bar"></div></div>
    <div id="animal">🐘</div>
    <div id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="feedback" aria-live="polite"></div>
    <button id="next" type="button">PRÓXIMA</button>
  </section>

  <section class="panel" id="result">
    <div id="resultStars">🌟</div>
    <h2 id="resultTitle">Muito bem!</h2>
    <p id="resultText"></p>
    <button class="primary" id="again" type="button">JOGAR NOVAMENTE</button>
    <p><button class="secondary" id="home" type="button">Voltar ao início</button></p>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const words = {
  pt:{language:"Idioma",intro:"Responde a 10 perguntas e ganha estrelas!",start:"COMEÇAR A JOGAR",question:"Pergunta",of:"de",next:"PRÓXIMA",correct:"Muito bem! Resposta certa! 🎉",wrong:"Quase! Vamos aprender juntos.",finish:"Terminaste o desafio!",points:"Acertaste",again:"JOGAR NOVAMENTE",home:"Voltar ao início",musicOn:"🔊 Som ligado",musicOff:"🔇 Som desligado",result:"O teu resultado",excellent:"Excelente trabalho!",good:"Muito bem! Continua a aprender!",try:"Boa tentativa! Joga novamente!",clues:["Que animal é este?","Descobre o animal pela pista:","Qual é o animal?"]},
  en:{language:"Language",intro:"Answer 10 questions and earn stars!",start:"START PLAYING",question:"Question",of:"of",next:"NEXT",correct:"Well done! Correct answer! 🎉",wrong:"Almost! Let's learn together.",finish:"You finished the challenge!",points:"You got",again:"PLAY AGAIN",home:"Back to start",musicOn:"🔊 Sound on",musicOff:"🔇 Sound off",result:"Your result",excellent:"Excellent work!",good:"Well done! Keep learning!",try:"Good try! Play again!",clues:["What animal is this?","Guess the animal from the clue:","Which animal is it?"]},
  fr:{language:"Langue",intro:"Réponds à 10 questions et gagne des étoiles !",start:"COMMENCER",question:"Question",of:"sur",next:"SUIVANTE",correct:"Bravo ! Bonne réponse ! 🎉",wrong:"Presque ! Apprenons ensemble.",finish:"Tu as terminé le défi !",points:"Tu as trouvé",again:"REJOUER",home:"Retour",musicOn:"🔊 Son activé",musicOff:"🔇 Son désactivé",result:"Ton résultat",excellent:"Excellent travail !",good:"Bravo ! Continue à apprendre !",try:"Bel essai ! Recommence !",clues:["Quel est cet animal ?","Trouve l'animal grâce à l'indice :","De quel animal s'agit-il ?"]},
  es:{language:"Idioma",intro:"¡Responde 10 preguntas y gana estrellas!",start:"EMPEZAR A JUGAR",question:"Pregunta",of:"de",next:"SIGUIENTE",correct:"¡Muy bien! ¡Respuesta correcta! 🎉",wrong:"¡Casi! Aprendamos juntos.",finish:"¡Has terminado el desafío!",points:"Has acertado",again:"JUGAR OTRA VEZ",home:"Volver al inicio",musicOn:"🔊 Sonido activado",musicOff:"🔇 Sonido desactivado",result:"Tu resultado",excellent:"¡Excelente trabajo!",good:"¡Muy bien! Sigue aprendiendo.",try:"¡Buen intento! Vuelve a jugar.",clues:["¿Qué animal es este?","Adivina el animal con esta pista:","¿Qué animal será?"]}
};

const animals = [
 {e:"🦁",n:["Leão","Lion","Lion","León"],d:["É conhecido como o rei da selva e tem uma juba.","It is known as the king of the jungle and has a mane.","Il est connu comme le roi de la jungle et possède une crinière.","Es conocido como el rey de la selva y tiene melena."]},
 {e:"🐘",n:["Elefante","Elephant","Éléphant","Elefante"],d:["Tem uma tromba comprida e orelhas grandes.","It has a long trunk and large ears.","Il a une longue trompe et de grandes oreilles.","Tiene una trompa larga y orejas grandes."]},
 {e:"🦒",n:["Girafa","Giraffe","Girafe","Jirafa"],d:["Tem um pescoço muito comprido e manchas no corpo.","It has a very long neck and spots on its body.","Elle a un très long cou et des taches sur le corps.","Tiene un cuello muy largo y manchas en el cuerpo."]},
 {e:"🐒",n:["Macaco","Monkey","Singe","Mono"],d:["Gosta de trepar às árvores e muitos comem frutas.","It likes climbing trees and many eat fruit.","Il aime grimper aux arbres et beaucoup mangent des fruits.","Le gusta trepar a los árboles y muchos comen frutas."]},
 {e:"🦓",n:["Zebra","Zebra","Zèbre","Cebra"],d:["Tem o corpo coberto de riscas pretas e brancas.","It has a body covered in black and white stripes.","Son corps est couvert de rayures noires et blanches.","Tiene el cuerpo cubierto de rayas blancas y negras."]},
 {e:"🐊",n:["Crocodilo","Crocodile","Crocodile","Cocodrilo"],d:["É um réptil que vive perto da água e tem dentes fortes.","It is a reptile that lives near water and has strong teeth.","C'est un reptile qui vit près de l'eau et possède de fortes dents.","Es un reptil que vive cerca del agua y tiene dientes fuertes."]},
 {e:"🦛",n:["Hipopótamo","Hippopotamus","Hippopotame","Hipopótamo"],d:["É um animal grande que passa muito tempo na água.","It is a large animal that spends a lot of time in water.","C'est un grand animal qui passe beaucoup de temps dans l'eau.","Es un animal grande que pasa mucho tiempo en el agua."]},
 {e:"🐬",n:["Golfinho","Dolphin","Dauphin","Delfín"],d:["É um mamífero marinho conhecido pelos seus saltos.","It is a sea mammal known for its jumps.","C'est un mammifère marin connu pour ses sauts.","Es un mamífero marino conocido por sus saltos."]},
 {e:"🦈",n:["Tubarão","Shark","Requin","Tiburón"],d:["É um peixe marinho com várias filas de dentes.","It is a sea fish with several rows of teeth.","C'est un poisson marin avec plusieurs rangées de dents.","Es un pez marino con varias filas de dientes."]},
 {e:"🐧",n:["Pinguim","Penguin","Manchot","Pingüino"],d:["É uma ave que não voa e nada muito bem.","It is a bird that cannot fly and swims very well.","C'est un oiseau qui ne vole pas et nage très bien.","Es un ave que no vuela y nada muy bien."]},
 {e:"🦅",n:["Águia","Eagle","Aigle","Águila"],d:["É uma ave de rapina com visão muito apurada.","It is a bird of prey with very sharp eyesight.","C'est un rapace avec une vue très perçante.","Es un ave rapaz con una vista muy aguda."]},
 {e:"🦉",n:["Coruja","Owl","Hibou","Búho"],d:["É uma ave que costuma estar ativa durante a noite.","It is a bird that is often active at night.","C'est un oiseau souvent actif pendant la nuit.","Es un ave que suele estar activa durante la noche."]},
 {e:"🐢",n:["Tartaruga","Turtle","Tortue","Tortuga"],d:["Tem uma carapaça que protege o seu corpo.","It has a shell that protects its body.","Elle possède une carapace qui protège son corps.","Tiene un caparazón que protege su cuerpo."]},
 {e:"🐍",n:["Cobra","Snake","Serpent","Serpiente"],d:["É um réptil comprido que não tem patas.","It is a long reptile with no legs.","C'est un long reptile sans pattes.","Es un reptil alargado que no tiene patas."]},
 {e:"🐸",n:["Rã","Frog","Grenouille","Rana"],d:["É um anfíbio que salta e vive perto de locais húmidos.","It is an amphibian that jumps and lives near wet places.","C'est un amphibien qui saute et vit près des endroits humides.","Es un anfibio que salta y vive cerca de lugares húmedos."]},
 {e:"🦋",n:["Borboleta","Butterfly","Papillon","Mariposa"],d:["É um inseto com asas coloridas.","It is an insect with colorful wings.","C'est un insecte aux ailes colorées.","Es un insecto con alas de colores."]},
 {e:"🐝",n:["Abelha","Bee","Abeille","Abeja"],d:["Produz mel e ajuda a polinizar as flores.","It makes honey and helps pollinate flowers.","Elle produit du miel et aide à polliniser les fleurs.","Produce miel y ayuda a polinizar las flores."]},
 {e:"🐜",n:["Formiga","Ant","Fourmi","Hormiga"],d:["É um pequeno inseto que vive em colónias.","It is a small insect that lives in colonies.","C'est un petit insecte qui vit en colonies.","Es un pequeño insecto que vive en colonias."]},
 {e:"🐕",n:["Cão","Dog","Chien","Perro"],d:["É um animal doméstico conhecido pela sua amizade com as pessoas.","It is a pet known for its friendship with people.","C'est un animal domestique connu pour son amitié avec les humains.","Es un animal doméstico conocido por su amistad con las personas."]},
 {e:"🐈",n:["Gato","Cat","Chat","Gato"],d:["É um animal doméstico que gosta de brincar e de dormir.","It is a pet that likes to play and sleep.","C'est un animal domestique qui aime jouer et dormir.","Es un animal doméstico al que le gusta jugar y dormir."]},
 {e:"🐄",n:["Vaca","Cow","Vache","Vaca"],d:["É um animal de quinta que produz leite.","It is a farm animal that produces milk.","C'est un animal de ferme qui produit du lait.","Es un animal de granja que produce leche."]},
 {e:"🐎",n:["Cavalo","Horse","Cheval","Caballo"],d:["É um animal forte que pode ser montado e corre depressa.","It is a strong animal that can be ridden and runs fast.","C'est un animal fort que l'on peut monter et qui court vite.","Es un animal fuerte que se puede montar y corre rápido."]},
 {e:"🐑",n:["Ovelha","Sheep","Mouton","Oveja"],d:["Tem lã no corpo e vive muitas vezes em rebanhos.","It has wool on its body and often lives in flocks.","Elle porte de la laine et vit souvent en troupeau.","Tiene lana en el cuerpo y suele vivir en rebaños."]},
 {e:"🐔",n:["Galinha","Chicken","Poule","Gallina"],d:["É uma ave doméstica que põe ovos.","It is a domestic bird that lays eggs.","C'est un oiseau domestique qui pond des œufs.","Es un ave doméstica que pone huevos."]},
 {e:"🐪",n:["Camelo","Camel","Chameau","Camello"],d:["É um animal adaptado a viver no deserto.","It is an animal adapted to living in the desert.","C'est un animal adapté à la vie dans le désert.","Es un animal adaptado para vivir en el desierto."]}
];

let lang="pt", questions=[], index=0, points=0, locked=false, musicEnabled=true;
let audio=null, musicTimer=null;

function langIndex(){return ["pt","en","fr","es"].indexOf(lang);}
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setLanguage(){
  lang=$("language").value;
  const w=words[lang];
  $("languageLabel").textContent=w.language;
  $("intro").textContent=w.intro;
  $("startButton").textContent=w.start;
  $("musicButton").textContent=musicEnabled?w.musicOn:w.musicOff;
  $("next").textContent=w.next;
  $("again").textContent=w.again;
  $("home").textContent=w.home;
  document.documentElement.lang=lang;
}
function makeQuestions(){
  const li=langIndex();
  questions=shuffle(animals).slice(0,10).map((animal,i)=>{
    const wrong=shuffle(animals.filter(a=>a!==animal)).slice(0,3);
    const options=shuffle([animal,...wrong]);
    return {animal, clue:words[lang].clues[i%3]+" "+animal.d[li], options};
  });
}
function startGame(){
  stopMusic();
  makeQuestions();index=0;points=0;locked=false;
  $("result").style.display="none";
  $("game").style.display="block";
  $("startButton").style.display="none";
  $("score").textContent="⭐ 0";
  showQuestion();
  if(musicEnabled) startMusic();
}
function showQuestion(){
  locked=false;
  const q=questions[index], w=words[lang], li=langIndex();
  $("questionCount").textContent=w.question+" "+(index+1)+" "+w.of+" 10";
  $("bar").style.width=(index/10*100)+"%";
  $("animal").textContent="❓";
  $("question").textContent=q.clue;
  $("feedback").textContent="";
  $("next").style.display="none";
  const area=$("answers");area.innerHTML="";
  q.options.forEach(option=>{
    const b=document.createElement("button");
    b.type="button";b.className="answer";b.textContent=option.n[li];
    b.addEventListener("click",()=>checkAnswer(b,option));
    area.appendChild(b);
  });
  speak(q.clue);
}
function checkAnswer(button,chosen){
  if(locked)return;
  locked=true;
  const q=questions[index], li=langIndex(), w=words[lang];
  const correct=chosen===q.animal;
  if(correct){points++;$("feedback").textContent=w.correct;button.classList.add("correct");playTone(660);}
  else{$("feedback").textContent=w.wrong;button.classList.add("wrong");playTone(220);}
  $("animal").textContent=q.animal.e;
  $("score").textContent="⭐ "+points;
  [...$("answers").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.animal.n[li])b.classList.add("correct");
  });
  $("next").style.display="block";
  speak(correct?w.correct:w.wrong);
}
function nextQuestion(){
  index++;
  if(index>=questions.length){finishGame();return;}
  showQuestion();
}
function finishGame(){
  stopMusic();
  $("game").style.display="none";
  $("result").style.display="block";
  const w=words[lang];
  $("resultStars").textContent="⭐".repeat(Math.max(1,Math.ceil(points/2)));
  $("resultTitle").textContent=points>=8?w.excellent:points>=5?w.good:w.try;
  $("resultText").textContent=w.finish+" "+w.points+" "+points+" / 10.";
  $("bar").style.width="100%";
  speak($("resultTitle").textContent+" "+$("resultText").textContent);
}
function goHome(){
  stopMusic();
  $("result").style.display="none";$("game").style.display="none";
  $("startButton").style.display="block";
}
function getAudio(){
  if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}
  if(audio&&audio.state==="suspended")audio.resume();
  return audio;
}
function playTone(freq){
  if(!musicEnabled)return;
  const a=getAudio();if(!a)return;
  const osc=a.createOscillator(),gain=a.createGain();
  osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(.0001,a.currentTime);
  gain.gain.exponentialRampToValueAtTime(.12,a.currentTime+.03);
  gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);
  osc.connect(gain);gain.connect(a.destination);osc.start();osc.stop(a.currentTime+.23);
}
function startMusic(){
  if(!musicEnabled||musicTimer)return;
  const notes=[392,494,587,494,440,523,659,523];let n=0;
  musicTimer=setInterval(()=>{
    if(!musicEnabled||!$("game")||$("game").style.display==="none"){stopMusic();return;}
    const a=getAudio();if(!a)return;
    const osc=a.createOscillator(),gain=a.createGain();
    osc.type="triangle";osc.frequency.value=notes[n++%notes.length];
    gain.gain.setValueAtTime(.0001,a.currentTime);
    gain.gain.exponentialRampToValueAtTime(.025,a.currentTime+.04);
    gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.28);
    osc.connect(gain);gain.connect(a.destination);osc.start();osc.stop(a.currentTime+.3);
  },360);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function toggleMusic(){
  musicEnabled=!musicEnabled;
  $("musicButton").textContent=musicEnabled?words[lang].musicOn:words[lang].musicOff;
  if(musicEnabled&&$("game").style.display==="block"){getAudio();startMusic();}
  else stopMusic();
}
function speak(message){
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(message);
  utter.lang={pt:"pt-PT",en:"en-US",fr:"fr-FR",es:"es-ES"}[lang];
  utter.rate=.9;window.speechSynthesis.speak(utter);
}

$("language").addEventListener("change",()=>{setLanguage();});
$("startButton").addEventListener("click",startGame);
$("next").addEventListener("click",nextQuestion);
$("again").addEventListener("click",startGame);
$("home").addEventListener("click",goHome);
$("musicButton").addEventListener("click",toggleMusic);
setLanguage();
</script>
</body>
</html>
