<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:linear-gradient(135deg,#d8fff0,#e8f5ff,#fff5d9);color:#243447;min-height:100vh}

header p{margin:6px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:650px;margin:15px auto;padding:0 14px}

.back{background:white;color:#168b70}
select{background:white;color:#168b70}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}
.stat{background:white;border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 12px #00000010}
.stat strong{display:block;font-size:21px;color:#079b78}
.stat span{font-size:12px}
.progress{height:12px;background:#d5e9e2;border-radius:20px;overflow:hidden;margin:10px 0 18px}
.bar{height:100%;width:0;background:#16b98b;transition:.3s}
.game{background:white;border-radius:25px;padding:20px;box-shadow:0 8px 25px #00000012;text-align:center}
.animal{font-size:75px;margin:12px auto;width:125px;height:115px;display:flex;align-items:center;justify-content:center;background:#effcf6;border-radius:25px}
.question{font-size:20px;font-weight:bold;margin:15px 0;line-height:1.5}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}
.answer{background:#eaf8f2;color:#176b57;border:2px solid #d2eee2;min-height:62px;font-size:16px}
.answer:disabled{opacity:1;cursor:default}
.feedback{min-height:38px;font-size:16px;font-weight:bold;margin-top:15px;line-height:1.4}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.primary{background:#0ca77e;color:white}
.sound{background:#fff0bd;color:#765400}
.hidden{display:none}
.result{font-size:18px;padding:15px;line-height:1.6}
footer{text-align:center;padding:20px;font-size:12px;color:#527568}
@media(max-width:420px){header h1{font-size:25px}.question{font-size:18px}.answer{font-size:14px;padding:10px 5px}}
</style>
</head>

const HISTORY_KEY="desafiamais_animais_history_365_v2";
const YEAR_MS=365*24*60*60*1000;
const GAME_SIZE=10;

let musicOn=false,audioCtx=null,musicTimer=null,musicStep=0;

function makeBank(){
 bank=[];
 animals.forEach((animal,animalIndex)=>{
  for(let variant=0;variant<10;variant++){
   bank.push({
    id:animal[0]+"-"+variant,
    animalIndex,
    prompt:templates.pt[variant],
    variant
   });
  }
 });
}
function getText(key){return T[lang][key]}
function getName(i){return animals[i][1][["pt","en","fr","es"].indexOf(lang)]}
function getClue(i){return animals[i][2][["pt","en","fr","es"].indexOf(lang)]}
function getPrompt(q){
 return templates[lang][q.variant].replace("{clue}",getClue(q.animalIndex));
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function loadHistory(){
 try{
  const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||"{}");
  const now=Date.now(),clean={};
  Object.keys(data).forEach(id=>{
   if(now-data[id]<YEAR_MS)clean[id]=data[id];
  });
  localStorage.setItem(HISTORY_KEY,JSON.stringify(clean));
  return clean;
 }catch(e){
  return null;
 }
}
function saveHistory(history){
 try{
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
  return true;
 }catch(e){
  return false;
 }
}
