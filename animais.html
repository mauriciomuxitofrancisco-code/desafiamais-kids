const HISTORY_KEY="desafiamais_animais_history_365_v3";
const YEAR_MS=365*24*60*60*1000;
let lang="pt",bank=[],gameQuestions=[],current=0,score=0,stars=0,answered=false;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function readHistory(){
 try{
  const now=Date.now();
  let h=JSON.parse(localStorage.getItem(HISTORY_KEY)||"{}");
  Object.keys(h).forEach(k=>{if(now-h[k]>YEAR_MS)delete h[k]});
  localStorage.setItem(HISTORY_KEY,JSON.stringify(h));
  return h;
 }catch(e){return null}
}
function saveSeen(id){
 try{
  const h=readHistory();
  if(!h)return false;
  h[id]=Date.now();
  localStorage.setItem(HISTORY_KEY,JSON.stringify(h));
  return true;
 }catch(e){return false}
}
